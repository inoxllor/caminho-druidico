<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caminho Druídico Pro Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caminho Druídico">

    <style>
        .theme-night {
            --bg-main: #090d16;
            --bg-header: #101625;
            --bg-card: #141b2d;
            --bg-inner: #0a0f1a;
            --border-color: #1e2942;
            --border-hover: #3b4f7d;
            --text-title: #e0e7ff;
            --text-accent: #818cf8;
            --text-muted: #c7d2fe;
            --btn-primary: #4f46e5;
            --btn-primary-hover: #6366f1;
        }

        .theme-forest {
            --bg-main: #09130d;
            --bg-header: #102217;
            --bg-card: #12261b;
            --bg-inner: #09130d;
            --border-color: #234731;
            --border-hover: #3c7853;
            --text-title: #fde68a;
            --text-accent: #34d399;
            --text-muted: #a7f3d0;
            --btn-primary: #059669;
            --btn-primary-hover: #10b981;
        }

        .theme-stone {
            --bg-main: #121212;
            --bg-header: #1c1c1c;
            --bg-card: #242424;
            --bg-inner: #141414;
            --border-color: #383838;
            --border-hover: #5c5c5c;
            --text-title: #f5f5f5;
            --text-accent: #a3a3a3;
            --text-muted: #e5e5e5;
            --btn-primary: #525252;
            --btn-primary-hover: #737373;
        }

        .theme-autumn {
            --bg-main: #170d0a;
            --bg-header: #24140e;
            --bg-card: #2d1912;
            --bg-inner: #120906;
            --border-color: #4a281d;
            --border-hover: #7c4432;
            --text-title: #fde68a;
            --text-accent: #f97316;
            --text-muted: #fed7aa;
            --btn-primary: #ea580c;
            --btn-primary-hover: #f97316;
        }

        .theme-mist {
            --bg-main: #0e1217;
            --bg-header: #161d26;
            --bg-card: #1e2633;
            --bg-inner: #10151c;
            --border-color: #2e3b4e;
            --border-hover: #4d617d;
            --text-title: #e2e8f0;
            --text-accent: #94a3b8;
            --text-muted: #cbd5e1;
            --btn-primary: #475569;
            --btn-primary-hover: #64748b;
        }

        .theme-gold {
            --bg-main: #141109;
            --bg-header: #211c10;
            --bg-card: #2b2515;
            --bg-inner: #120f08;
            --border-color: #4d4022;
            --border-hover: #8c733c;
            --text-title: #fef08a;
            --text-accent: #eab308;
            --text-muted: #fef3c7;
            --btn-primary: #ca8a04;
            --btn-primary-hover: #eab308;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #e8f5e9;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }
        .theme-card { background-color: var(--bg-card); border-color: var(--border-color); transition: border-color 0.2s ease, transform 0.2s ease; }
        .theme-card:hover { border-color: var(--border-hover); }
        .theme-inner { background-color: var(--bg-inner); border-color: var(--border-color); }
        .theme-title { color: var(--text-title); }
        .theme-accent { color: var(--text-accent); }
        .theme-muted { color: var(--text-muted); }
        
        .nav-item { transition: all 0.2s ease; }
        .nav-item:hover { background-color: var(--bg-card); border-color: var(--border-hover); }
        .nav-item.active { background-color: var(--btn-primary); color: #ffffff; border-color: var(--border-hover); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); }

        .breath-animation { transition: transform 4s ease-in-out, border-color 4s ease-in-out; }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        .awen-symbol {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.1em;
            font-weight: 900;
        }
    </style>
</head>
<body id="app-body" class="theme-night min-h-screen flex flex-col lg:flex-row">

    <!-- SIDEBAR DESKTOP -->
    <aside class="hidden lg:flex lg:flex-col lg:w-72 lg:fixed lg:inset-y-0 bg-[var(--bg-header)] border-r border-[var(--border-color)] z-40 shadow-2xl">
        <div class="p-6 border-b border-[var(--border-color)] flex items-center gap-3.5">
            <span class="text-3xl theme-accent awen-symbol drop-shadow">/ I \</span>
            <div>
                <h1 class="font-cinzel text-lg font-bold theme-title tracking-wider leading-tight">CAMINHO DRUÍDICO</h1>
                <p class="text-[10px] theme-accent uppercase tracking-widest mt-0.5">Pro Ultimate • OBOD</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-1.5 text-xs font-semibold">
            <div class="text-[10px] uppercase tracking-widest theme-muted opacity-50 px-3 pt-1 pb-1">Oráculos & Sabedoria</div>
            <button onclick="switchTab('oracle')" id="desk-nav-oracle" class="nav-item active w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] text-left">
                <span class="text-base w-5 text-center">ᚁ</span> Oráculo de Ogham
            </button>
            <button onclick="switchTab('runes')" id="desk-nav-runes" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">ᚠ</span> Runas Elder Futhark
            </button>
            <button onclick="switchTab('herbal')" id="desk-nav-herbal" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🌲</span> Herbal & Árvores (20 Ogham)
            </button>
            <button onclick="switchTab('triads')" id="desk-nav-triads" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🔺</span> Tríades de Barddas
            </button>

            <div class="text-[10px] uppercase tracking-widest theme-muted opacity-50 px-3 pt-4 pb-1">Ciclos & Orientação</div>
            <button onclick="switchTab('astro')" id="desk-nav-astro" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🌕</span> Astronomia (Lua & Sol)
            </button>
            <button onclick="switchTab('wheel')" id="desk-nav-wheel" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🎡</span> A Roda do Ano
            </button>
            <button onclick="switchTab('compass')" id="desk-nav-compass" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🧭</span> Bússola & Portais GPS
            </button>

            <div class="text-[10px] uppercase tracking-widest theme-muted opacity-50 px-3 pt-4 pb-1">Prática & Registo</div>
            <button onclick="switchTab('obod')" id="desk-nav-obod" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🌿</span> Graus OBOD & Awen
            </button>
            <button onclick="switchTab('podcasts')" id="desk-nav-podcasts" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🎙️</span> Druidcast & Áudio
            </button>
            <button onclick="switchTab('ritual')" id="desk-nav-ritual" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">📜</span> Criador de Rituais
            </button>
            <button onclick="switchTab('journal')" id="desk-nav-journal" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">📖</span> Diário & Backups
            </button>
            <button onclick="switchTab('grounding')" id="desk-nav-grounding" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl theme-inner border border-[var(--border-color)] theme-muted text-left">
                <span class="text-base w-5 text-center">🎧</span> Som & Respiração
            </button>
        </nav>

        <!-- Secção de Apoio e Tema na Sidebar -->
        <div class="p-4 border-t border-[var(--border-color)] space-y-3">
            <div>
                <label class="text-[10px] uppercase tracking-widest theme-muted opacity-70 block mb-1.5">Apoiar o Projeto</label>
                <div class="grid grid-cols-2 gap-2">
                    <a href="https://www.buymeacoffee.com/inoxllor" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 bg-[#FFDD00] hover:bg-[#ffea5c] text-slate-950 font-bold text-[11px] py-2 px-2.5 rounded-xl shadow transition">
                        <span>☕</span> Coffee
                    </a>
                    <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=inoxllor@gmail.com&item_name=Apoio+Caminho+Druidico+Pro&currency_code=EUR" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 bg-[#0070BA] hover:bg-[#0082d9] text-white font-bold text-[11px] py-2 px-2.5 rounded-xl shadow transition">
                        <span>💙</span> PayPal
                    </a>
                </div>
            </div>

            <div>
                <label class="text-[10px] uppercase tracking-widest theme-muted opacity-70 block mb-1">Ambiente Visual</label>
                <select id="theme-selector-desktop" onchange="changeTheme(this.value)" class="w-full bg-[var(--bg-inner)] border border-[var(--border-color)] text-xs text-[var(--text-title)] rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                    <option value="theme-night">🌙 Noite Mística</option>
                    <option value="theme-forest">🌲 Floresta Profunda</option>
                    <option value="theme-stone">🗿 Pedra Ancestral</option>
                    <option value="theme-autumn">🍂 Outono Dourado</option>
                    <option value="theme-mist">🌫️ Neblina Mística</option>
                    <option value="theme-gold">✨ Solstício Dourado</option>
                </select>
            </div>
        </div>
    </aside>

    <!-- HEADER MOBILE -->
    <header class="lg:hidden bg-[var(--bg-header)]/95 backdrop-blur-md border-b border-[var(--border-color)] sticky top-0 z-50 shadow-xl">
        <div class="px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="text-2xl theme-accent awen-symbol">/ I \</span>
                <div>
                    <h1 class="font-cinzel text-sm font-bold theme-title tracking-wider">CAMINHO DRUÍDICO</h1>
                    <p class="text-[9px] theme-accent opacity-90 uppercase">Sabedoria Céltica</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <a href="https://www.buymeacoffee.com/inoxllor" target="_blank" rel="noopener noreferrer" title="Buy Me a Coffee" class="bg-[#FFDD00] text-slate-950 font-bold text-xs px-2 py-1.5 rounded-lg shadow">☕</a>
                <a href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=inoxllor@gmail.com&item_name=Apoio+Caminho+Druidico+Pro&currency_code=EUR" target="_blank" rel="noopener noreferrer" title="Doar via PayPal" class="bg-[#0070BA] text-white font-bold text-xs px-2 py-1.5 rounded
