# Testa a app e publica-a no GitHub Pages a cada alteração no ramo main.
# Requer, uma vez: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências de teste
        run: npm install --no-audit --no-fund
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Correr os testes
        run: npm test

  publicar:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # As permissões do job substituem as do topo: «actions: read» é preciso
    # para o deploy-pages encontrar o artefacto que o passo anterior enviou.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js LICENSE css js icons _site/
          node tools/build-single.mjs _site/caminho-druidico.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
